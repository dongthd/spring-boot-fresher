server:
  port: 8080

spring:
  application:
    name: spring-boot-fresher
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_fresher
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format-sql: true
        use_sql_comments: true